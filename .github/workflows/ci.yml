name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta, nightly]
        exclude:
          # Reduce CI time by only testing nightly on Ubuntu
          - os: windows-latest
            rust: nightly
          - os: macos-latest
            rust: nightly
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Test builds always enable `serde` through the crate's dev-dependency on
      # itself, so a separate no-features test run would repeat this one.
      - name: Run tests
        run: cargo test --all-features --verbose

      - name: Run doc tests
        run: cargo test --doc --all-features

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Only a library-only build leaves the dev-dependencies, and with them
      # the `serde` feature, out.
      - name: Run clippy (library, no features)
        run: cargo clippy --lib --no-default-features -- -D warnings

      - name: Run clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Keep in sync with `rust-version` in Cargo.toml.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check library (no features)
        run: cargo check --lib --no-default-features

      - name: Check library (all features)
        run: cargo check --lib --all-features

  no-std:
    name: no_std
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build library for a no_std target (no features)
        run: cargo build --lib --target thumbv7em-none-eabihf --no-default-features

      - name: Build library for a no_std target (serde)
        run: cargo build --lib --target thumbv7em-none-eabihf --features serde

      - name: Build library for a no_std target (schemars)
        run: cargo build --lib --target thumbv7em-none-eabihf --features schemars

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check documentation
        run: cargo doc --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  # Builds the docs the way docs.rs does, so a nightly change to `doc_cfg` shows
  # up here before it breaks the published page.
  docs-rs:
    name: docs.rs build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build documentation as docs.rs does
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  miri:
    name: Miri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Miri is slow, so the property tests run 8 cases instead of 256. Isolation
      # is off because proptest reads its regression files from disk.
      - name: Run tests under Miri
        run: |
          cargo miri setup
          cargo miri test --all-features --lib --tests
        env:
          PROPTEST_CASES: 8
          MIRIFLAGS: -Zmiri-disable-isolation

  minimal-versions:
    name: Minimal dependency versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      # Only the library is checked: the dev-dependencies do not build at their
      # minimal versions, and users never build them.
      - name: Check the library against the lowest allowed versions
        run: |
          cargo update -Z direct-minimal-versions
          cargo check --lib --all-features

  semver:
    name: Semver
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check for breaking changes against the latest release
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          feature-group: all-features

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run security audit
        uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
