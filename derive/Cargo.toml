[package]
name = "presence-rs-derive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Derive macro for presence-rs: generates a Presence-based patch struct for a model struct."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/presence-rs"
keywords = ["patch", "derive", "nullable", "presence", "serde"]
categories = ["development-tools::procedural-macro-helpers", "rust-patterns", "encoding"]
include = ["src/**/*.rs", "Cargo.toml", "LICENSE"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { version = "1.0.91", default-features = false, features = ["proc-macro"] }
quote = { version = "1.0.35", default-features = false, features = ["proc-macro"] }
syn = { version = "3.0.9", default-features = false, features = ["derive", "parsing", "printing", "proc-macro"] }

[dev-dependencies]
presence-rs = { path = "..", features = ["derive", "serde", "schemars"] }
proptest = "1.11.0"
serde = { version = "1.0.194", features = ["derive"] }
schemars = { version = "1", features = ["derive"] }
serde_json = "1.0.127"
syn = { version = "3.0.9", features = ["full", "extra-traits"] }
trybuild = "1.0.100"
rustversion = "1.0.20"

[lints]
workspace = true
